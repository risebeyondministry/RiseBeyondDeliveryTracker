

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RiseBeyond Delivery Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: white; }
    h2 { color: #0077cc; text-align: center; }
    label { display: block; margin-top: 10px; font-weight: bold; color: #444; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; box-sizing: border-box; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f4f4f4; color: #0077cc; }
    .btn { background: #FFD700; color: #2c3e50; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn:hover { background: #e6c200; }
    .btn-clear { background: #888; color: white; }
    .btn-clear:hover { background: #555; }
    #runner { margin-top: 15px; font-weight: bold; color: #0077cc; text-align: center; font-size: 18px; }
    #totalRow { font-weight: bold; background: #f9f9f9; }
  </style>
</head>
<body>
  <h2>RiseBeyond Delivery Tracker</h2>

  <label>Name:</label>
  <input type="text" id="name" value="Rogicj">

  <label>Date:</label>
  <input type="date" id="date">

  <label>Drop-off Place:</label>
  <select id="place">
    <option value="">-- Select Place --</option>
    <option>Bank Deposit</option>
    <option>Bank Deposit Safe</option>
    <option>Fed Ex</option>
    <option>TPP</option>
    <option>Ferry Dock</option>
    <option>Port</option>
    <option>Letter Drop</option>
    <option>Pockwood Pond</option>
    <option>Garbage Run</option>
    <option>Bill Payments</option>
    <option>Misc. Errands 1</option>
    <option>Misc. Errands 2</option>
    <option>Misc. Errands 3</option>
    <option>Other</option>
  </select>

  <label>Travel Mode:</label>
  <select id="mode">
    <option value="">-- Select Mode --</option>
    <option>Walking</option>
    <option>Driving</option>
  </select>

  <label>Start Time:</label>
  <input type="time" id="start" onchange="autoRun()">

  <label>End Time:</label>
  <input type="time" id="end" onchange="autoRun()">

  <div id="runner">Time Remaining: 0m</div>

  <label><input type="checkbox" id="soundToggle"> Toggle Sound</label>
<label><input type="checkbox" id="vibrateToggle"> Toggle Vibrate</label>

  <button class="btn" onclick="addEntry()">Add Entry</button>
  <button class="btn btn-clear" onclick="clearLog()">Clear Log</button>

  <table id="log">
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Place</th>
      <th>Mode</th>
      <th>Start</th>
      <th>End</th>
      <th>Time Spent</th>
    </tr>
    <tr id="totalRow">
      <td colspan="3">Total Walking</td>
      <td colspan="3">Total Driving</td>
      <td id="totalTime">0h 0m</td>
    </tr>
  </table>

  <script>
    let timerInterval;
    let runStart;
    let runEstimateMins = 0;
    let deliveryLog = [];

    window.onload = function() {
      const saved = localStorage.getItem('deliveryLog');
      if (saved) {
        deliveryLog = JSON.parse(saved);
        deliveryLog.forEach(entry => renderRow(entry));
        updateTotals();
      }
    };

    function parseTimeToDate(t) {
      // Converts "HH:MM" into a Date anchored at 1970-01-01
      return new Date('1970-01-01T' + t + ':00');
    }

    function autoRun() {
      clearInterval(timerInterval);
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      if (!start || !end) return;

      const startTime = parseTimeToDate(start);
      const endTime = parseTimeToDate(end);
      const diffMs = endTime - startTime;
      if (diffMs <= 0) {
        document.getElementById('runner').textContent = 'Invalid time range';
        return;
      }

      runEstimateMins = Math.floor(diffMs / 60000);
      runStart = new Date();

     timerInterval = setInterval(() => {
  const now = new Date();
  const diffMins = Math.floor((now - runStart) / 60000);
  const remaining = runEstimateMins - diffMins;

  document.getElementById('runner').textContent =
    remaining >= 0 ? 'Time Remaining: ' + remaining + 'm'
                   : 'Over Time: ' + Math.abs(remaining) + 'm';

  // 🔔 Optional alerts
  if (remaining === 0 && document.getElementById('soundToggle').checked) new Audio('ping.mp3').play();
  if (remaining === 0 && document.getElementById('vibrateToggle').checked) navigator.vibrate(500);

}, 1000);


    }

    function addEntry() {
      clearInterval(timerInterval);
      const name = document.getElementById('name').value.trim();
      const date = document.getElementById('date').value;
      const place = document.getElementById('place').value;
      const mode = document.getElementById('mode').value;
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;

      if (!name || !date || !place || !mode || !start || !end) {
        alert('Please fill in Name, Date, Place, Mode, Start, and End.');
        return;
      }

      const startTime = parseTimeToDate(start);
      const endTime = parseTimeToDate(end);
      const diffMs = endTime - startTime;
      if (diffMs <= 0) {
        alert('End Time must be after Start Time.');
        return;
      }

      const diffMins = diffMs / 60000;
      const hours = Math.floor(diffMins / 60);
      const minutes = Math.round(diffMins % 60);

      const entry = { name, date, place, mode, start, end, hours, minutes };
      deliveryLog.push(entry);
      localStorage.setItem('deliveryLog', JSON.stringify(deliveryLog));

      renderRow(entry);
      updateTotals();

      // Reset fields (keep Name/Date to ease multiple entries)
      document.getElementById('place').value = '';
      document.getElementById('mode').value = '';
      document.getElementById('start').value = '';
      document.getElementById('end').value = '';
      document.getElementById('runner').textContent = 'Time Remaining: 0m';
      runEstimateMins = 0;
    }

    function renderRow(entry) {
      const row = document.createElement('tr');
      row.innerHTML =
        '<td>' + entry.name + '</td>' +
        '<td>' + entry.date + '</td>' +
        '<td>' + entry.place + '</td>' +
        '<td>' + entry.mode + '</td>' +
        '<td>' + entry.start + '</td>' +
        '<td>' + entry.end + '</td>' +
        '<td>' + entry.hours + 'h ' + entry.minutes + 'm</td>';
      const totalRow = document.getElementById('totalRow');
      totalRow.parentNode.insertBefore(row, totalRow);
    }

    function updateTotals() {
      let totalMinutes = 0, walkMinutes = 0, driveMinutes = 0;

      deliveryLog.forEach(entry => {
        const mins = entry.hours * 60 + entry.minutes;
        totalMinutes += mins;
        if (entry.mode === 'Walking') walkMinutes += mins;
        if (entry.mode === 'Driving') driveMinutes += mins;
      });

      const totalHours = Math.floor(totalMinutes / 60);
      const totalMins = totalMinutes % 60;
      const walkHours = Math.floor(walkMinutes / 60);
      const walkMins = walkMinutes % 60;
      const driveHours = Math.floor(driveMinutes / 60);
      const driveMins = driveMinutes % 60;

      document.getElementById('totalRow').innerHTML =
        '<td colspan="3">Walking: ' + walkHours + 'h ' + walkMins + 'm</td>' +
        '<td colspan="3">Driving: ' + driveHours + 'h ' + driveMins + 'm</td>' +
        '<td id="totalTime">Total: ' + totalHours + 'h ' + totalMins + 'm</td>';
    }

    function clearLog() {
      clearInterval(timerInterval);
      deliveryLog = [];
      localStorage.removeItem('deliveryLog');
      document.getElementById('log').innerHTML =
        '<tr>' +
          '<th>Name</th>' +
          '<th>Date</th>' +
          '<th>Place</th>' +
          '<th>Mode</th>' +
          '<th>Start</th>' +
          '<th>End</th>' +
          '<th>Time Spent</th>' +
        '</tr>' +
        '<tr id="totalRow">' +
          '<td colspan="3">Total Walking</td>' +
          '<td colspan="3">Total Driving</td>' +
          '<td id="totalTime">0h 0m</td>' +
        '</tr>';
      document.getElementById('runner').textContent = 'Time Remaining: 0m';
      runEstimateMins = 0;
    }
  </script>
<footer style="margin-top:40px; text-align:center; font-size:14px; color:#777;">
  Romans 12:11 — “Never be lacking in zeal, but keep your spiritual fervor, serving the Lord.”
</footer>

</body>
</html>
